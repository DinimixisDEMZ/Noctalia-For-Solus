name: noctalia
version: 5.0.1
release: 1
source:
    - https://github.com/noctalia-dev/noctalia/archive/refs/tags/v5.0.1.tar.gz: ed8334f294e9f94f4744e315b674511fc51203a6a56c561af8803a6eb6884698
homepage: https://github.com/noctalia-dev/noctalia
license: MIT
component: desktop.wayland
summary: A sleek, customizable desktop shell crafted for Wayland
description: |
    Noctalia is a full desktop shell (bars, dock, launcher, notifications,
    lock screen, wallpaper, settings, ...) built directly on Wayland and
    OpenGL ES with no Qt or GTK dependency. v5 is a ground-up C++ rewrite
    with TOML configuration, a Luau plugin system, and native compositor
    integration for Niri, Hyprland, Sway, Scroll, Mango, Labwc, Triad, dwl
    and other Wayland compositors. It replaces the Quickshell-based v4.
builddeps:
    - pkgconfig(cairo)
    - pkgconfig(egl)
    - pkgconfig(fontconfig)
    - pkgconfig(freetype2)
    - pkgconfig(glib-2.0)
    - pkgconfig(harfbuzz)
    - pkgconfig(jemalloc)
    - pkgconfig(libcurl)
    - pkgconfig(libical)
    - pkgconfig(libjxl)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libqalculate)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libsecret-1)
    - pkgconfig(libsodium)
    - pkgconfig(libwebp)
    - pkgconfig(libxml-2.0)
    - pkgconfig(md4c)
    - pkgconfig(nlohmann_json)
    - pkgconfig(pam)
    - pkgconfig(pango)
    - pkgconfig(polkit-agent-1)
    - pkgconfig(sdbus-c++)
    - pkgconfig(sndfile)
    - pkgconfig(tomlplusplus)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-egl)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wireplumber-0.5)
    - pkgconfig(xkbcommon)
    - stb
setup: |
    %meson_configure \
        -Djemalloc=auto \
        -Dtests=disabled
build: |
    %ninja_build
install: |
    %ninja_install
    %install_license LICENSE
    mkdir -p $installdir/usr/share/bash-completion/completions \
             $installdir/usr/share/zsh/site-functions \
             $installdir/usr/share/fish/vendor_completions.d
    ./solusBuildDir/noctalia completions bash > $installdir/usr/share/bash-completion/completions/noctalia
    ./solusBuildDir/noctalia completions zsh > $installdir/usr/share/zsh/site-functions/_noctalia
    ./solusBuildDir/noctalia completions fish > $installdir/usr/share/fish/vendor_completions.d/noctalia.fish